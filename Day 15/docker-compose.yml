services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: akash
      POSTGRES_PASSWORD: password
      POSTGRES_DB: day15_tasks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akash -d day15_tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://akash:password@db:5432/day15_tasks
      PORT: 8000
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      # Use the Node build stage for local hot-reload dev. The default
      # (production) stage serves the static build via nginx for Railway.
      target: build
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    env_file:
      - frontend/.env
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    profiles: [observability]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    profiles: [observability]
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.15.0
    profiles: [observability]
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "8200:8200"
    command:
      - apm-server
      - -e
      - -E
      - apm-server.rum.enabled=true
      - -E
      - output.elasticsearch.hosts=["elasticsearch:9200"]

volumes:
  postgres_data:
  elasticsearch_data:

  # Optional Elastic Stack for local APM. Start with:
  #   docker compose --profile observability up
  # Set ELASTIC_APM_SERVER_URL=http://apm-server:8200 in .env when using this profile.
