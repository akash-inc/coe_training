name: Accessibility Practice CI

# Runs the Storybook + axe-core accessibility tests for accessibility_practice.
# Any WCAG 2.0 A/AA violation in a story fails the build
# (see accessibility_practice/frontend/.storybook/preview.jsx -> a11y.test).

on:
  push:
    branches: [main]
    paths:
      - "accessibility_practice/**"
      - ".github/workflows/accessibility-practice-ci.yaml"
  pull_request:
    paths:
      - "accessibility_practice/**"
      - ".github/workflows/accessibility-practice-ci.yaml"

jobs:
  a11y:
    name: Storybook a11y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accessibility_practice/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: accessibility_practice/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:a11y
