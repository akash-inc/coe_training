name: Day 15 CI

on:
  push:
    branches: [main]
    paths:
      - "Day 15/**"
      - ".github/workflows/day15-ci.yaml"
  pull_request:
    paths:
      - "Day 15/**"
      - ".github/workflows/day15-ci.yaml"

jobs:
  day15-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Day 15"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: day15_tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Day 15/requirements.txt
            Day 15/requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/day15_tasks_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/day15_tasks_test
        run: python -m pytest -q

  day15-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Day 15/frontend"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Day 15/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
